# Hugo github-profile module -- Russian UI strings.
# Sentence-shaped plural tables receive `count` (form selection) and `formatted` (the
# locale-grouped number); interpolate `{{ .formatted }}`, never `{{ .count }}`. Bare
# unit-word tables (calendar_unit, the org_stat_* keys) receive the raw count alone and
# contain no interpolation.

