# The same surfaces the `configured` environment sets, so the subpath build
# differs from it in exactly one respect: the baseURL carries a path. Every
# value below is authored in the SITE-RELATIVE, leading-slash form the module
# documents, which is precisely the form Hugo's absURL resolves against the
# protocol and host alone.
# Renders the canonifyURLs probe on the home page. This environment backs two
# builds -- itself and the canonifyURLs one layered on top of it -- and the
# module emits only absolute URLs, so nothing it publishes differs between
# them. The probe is what gives the second build something to observe: it
# carries one relURL-derived value in an attribute Hugo's post-processor
# rewrites and the same value in one it leaves alone. At a domain root both
# spellings collapse, which is why no other environment sets this.
fixture_canonify_probe = true

[seo]
  content_license = 'https://creativecommons.org/licenses/by/4.0/'

  # A site-level sub-table written as a scalar. jsonld/organization.html reads
  # `.type` off it on EVERY page, so uncoerced this took the whole build down
  # rather than degrading one node. Carried here rather than in `configured`
  # because the person-@id specs read that tree and need a real organization.
  organization = 'Acme'


  # A site-root image path -- the form a static/ file must be written as,
  # because static/ is invisible to resources.Get. It feeds og:image,
  # og:image:secure_url, twitter:image and every JSON-LD image node.
  default_image = '/img/og-default.png'

  # The generated-image hook written as a LIST. A partial path is one string,
  # and a list of them names no template at all; `with` treats a populated
  # list as present, so the value really does reach the lookup rather than
  # being skipped upstream. Degrading to unset here leaves default_image above
  # to answer, so the tree is byte-identical either way and only the warning
  # tells the consumer their key did nothing.
  image_partial = ['fixture/og-card.html']

  # A consumer-authored canonical override. rel="canonical" is the one tag
  # whose entire job is to be exactly right, so a dropped path prefix here is
  # the most damaging instance of the whole class.
  canonical = '/canonical-override/'

  # The SCALAR spelling of the site-level keywords the `configured`
  # environment writes as a list. Only this form can tell the one-item-list
  # coercion from a raw `delimit`, which accepts a bare string and iterates it
  # BYTE-WISE; both trees must publish the identical comma-joined string.
  keywords = 'alpha, beta'

  # A site-root search template. Feeds the JSON-LD SearchAction target.
  [seo.website]
    search_url_template = '/search/?q={search_term_string}'

  [seo.alternates]
    # The SCALAR form. Gating on IsSlice made this behave exactly like unset,
    # so the twins were published and never linked -- silently disabling the
    # one surface alternates.html exists to provide.
    formats = 'markdown'

  [seo.links]
    privacy_policy = '/privacy-policy/'
    author = '/authors/jane-doe/'
    search = '/opensearch.xml'
    license = 'https://creativecommons.org/licenses/by/4.0/'
    not_a_real_relation = '/nowhere/'
