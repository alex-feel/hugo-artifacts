# Baseline configuration: the three newer config blocks -- [seo.alternates],
# [seo.links] and [seo] content_license -- are deliberately ABSENT here, so a
# default build proves the additive change is inert when unconfigured. The
# `configured` environment adds them.
baseURL = 'https://seo-fixture.example/'
title = 'SEO Fixture'
locale = 'en-us'

# page gains a markdown output so the alternates allow-list has a real
# representation to advertise. section restates rss, which Hugo would
# otherwise drop when the key is introduced.
[outputs]
  home = ['html', 'rss']
  section = ['html', 'rss']
  page = ['html', 'markdown']

[module]

  [module.hugoVersion]
    min = "0.160.0"

  [[module.imports]]
    path = "github.com/alex-feel/hugo-artifacts/modules/seo"

[params]

  [params.seo]
    description = 'A fixture site for the seo module.'
    # A non-map [seo.links]. Gated silently it loses rel="license",
    # rel="author", rel="search" and rel="privacy-policy" from every page with
    # no signal -- the same behaves-exactly-like-unset failure the scalar
    # `formats` form causes. The BASELINE environment holds it because these
    # specs already assert that no link relation is emitted here, so the
    # degraded output is what they expect either way; only the warning is new.
    links = 'not-a-table'

    [params.seo.organization]
      name = 'Jane Doe'
      type = 'Person'

    # The site-owner author page is located from these two values, which is
    # how the person anchor resolves without any page-derived input.
    [params.seo.author]
      path_prefix = '/authors/'
      name = 'Jane Doe'

    [params.seo.types]
      [params.seo.types.sections]
        blog = 'BlogPosting'
        authors = 'ProfilePage'
