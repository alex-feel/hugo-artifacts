baseURL = "http://localhost:1717/"
defaultContentLanguage = "en"
title = "Carousel Fixture Bare"

[languages]

  [languages.en]
    locale = "en-US"
    weight = 1

[markup]

  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false

    [markup.goldmark.parser.attribute]
      block = true
      title = true

# Same markdown-twin wiring as fixture/, kept identical so the standalone
# build exercises the twin (06-markdown-twin) without modules/images present.
[outputs]
  page = ['html', 'markdown']

[params]
description = "Hugo carousel module Playwright validation fixture site (standalone, no modules/images)."

[module]

  [module.hugoVersion]
    min = "0.160.0"

  [[module.imports]]
    path = "github.com/alex-feel/hugo-artifacts/modules/carousel"
