{{/*
  search/noscript.html -- INTERNAL (renderer tier), designed for shadowing.

  Purpose: the content of the dedicated search page's <noscript> slot. The
  shipped default is one localized guidance line; when the resolved
  configuration carries a non-empty index_url (the searchindex output format
  is wired), the line gains a pointer sentence linking the per-language JSON
  index, so a JavaScript-less visitor or agent still reaches the
  machine-readable corpus the module itself publishes. On the unwired-index
  degradation path the pointer is omitted and the guidance line renders
  alone. A consuming site shadows this partial
  (layouts/_partials/search/noscript.html) to link browsable section,
  taxonomy, or archive indexes -- or, strictly as an opt-in privacy
  trade-off documented in the module README, an external-engine GET form --
  without touching the page skeleton.

  Expected context (dict): the surface context (page, cfg); the default
  reads cfg.index_url for the index pointer and ignores the rest, but
  shadowing sites receive the full picture.

  Return value: none. This partial renders.
*/}}

<p class="search__noscript-text">{{ T "search_noscript" | default "Searching this site requires JavaScript. Use the site navigation to browse instead." }}{{ with .cfg.index_url }} {{ T "search_noscript_index" | default "The full search index is available as JSON:" }} <a class="search__noscript-link" href="{{ . }}">{{ . }}</a>{{ end }}</p>
