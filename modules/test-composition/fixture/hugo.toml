# A consuming site that imports seo, agent-readiness, search, pwa, og-image AND
# url-retirement at once.
#
# Two surfaces here can only exist in a site that holds more than one module.
# The first is the [outputs] table below. The second is the pair of [params.seo]
# image keys further down, which hand a page with no image of its own to the
# og-image module and publish what it composes as that page's og:image -- a
# generated card crossing a real module boundary, which no fixture importing
# either module alone can produce.
#
# The ONE table this fixture exists for is [outputs]. Hugo REPLACES the output
# list per page kind rather than merging it, and a module's own [outputs] table
# is inert -- it does not reach the consumer configuration at all. Every module
# README therefore shows an [outputs] block of its own, and a consumer that
# copies them one after another either fails to load the configuration (TOML
# refuses a second `[outputs]` table in the same file) or keeps only the last
# block and silently loses every document the earlier ones asked for. The
# single merged home list below is the shape that publishes all of them, and
# the spec asserts every name in it.
#
# [outputFormats] and [mediaTypes] DO merge additively from module
# configuration, which is why `llmstxt`, `llmsindex`, `agentfacts`, `agentskills`,
# `searchindex`, `opensearch`, `redirects` and `urlmanifest` are usable here by
# name although this file defines none of them -- and `redirects` proves the
# [mediaTypes] half of that claim too, because its suffix-less media type is
# declared in a module and nothing here restates it.
baseURL = 'https://composition.example/'
title = 'Composition Fixture'
locale = 'en-us'

# robots.txt comes from the agent-readiness module; this fixture deliberately
# ships no layouts/robots.txt of its own, which would shadow it silently.
enableRobotsTXT = true

# The two switches the url-retirement module cannot set for a consumer: a
# module's hugo.toml reaches the site's [mediaTypes] and [outputFormats] and
# nothing else, so an alias would otherwise still publish the meta-refresh stub
# that beats the generated 301.
disableAliases = true

[pagination]
  disableAliases = true

[build]
  # This fixture holds assets/ (the card background) and, through the pwa and
  # search modules, calls js.Build. Together those make Hugo write an editor
  # intellisense file into assets/ on every build, whose contents are absolute
  # paths into the building machine's own Hugo module cache. A build target is
  # not an editor workspace: the file is machine-specific, would differ per
  # contributor and per runner, and nothing here reads it.
  noJSConfigInAssets = true

[outputs]
  home = ['html', 'rss', 'markdown', 'llmstxt', 'llmsindex', 'agentfacts', 'agentskills', 'searchindex', 'opensearch', 'webappmanifest', 'redirects', 'urlmanifest']
  section = ['html', 'rss', 'markdown']
  page = ['html', 'markdown']

[module]

  [module.hugoVersion]
    min = "0.160.0"

  [[module.imports]]
    path = "github.com/alex-feel/hugo-artifacts/modules/seo"

  [[module.imports]]
    path = "github.com/alex-feel/hugo-artifacts/modules/agent-readiness"

  [[module.imports]]
    path = "github.com/alex-feel/hugo-artifacts/modules/search"

  [[module.imports]]
    path = "github.com/alex-feel/hugo-artifacts/modules/pwa"

  [[module.imports]]
    path = "github.com/alex-feel/hugo-artifacts/modules/og-image"

  [[module.imports]]
    path = "github.com/alex-feel/hugo-artifacts/modules/url-retirement"

  # The four content-side modules, here for one reason: each publishes a file
  # belonging to THIS site -- a bundle image, a global asset, an icon -- by
  # reading its URL, which no walk of .Site.Pages can see. Alone, each one's own
  # suite can prove what it renders and nothing about what the registry learns;
  # only a site holding them beside url-retirement can show the URL arriving in
  # /url-manifest.txt with nothing configured for it.
  [[module.imports]]
    path = "github.com/alex-feel/hugo-artifacts/modules/images"

  [[module.imports]]
    path = "github.com/alex-feel/hugo-artifacts/modules/social-share"

  [[module.imports]]
    path = "github.com/alex-feel/hugo-artifacts/modules/carousel"

  [[module.imports]]
    path = "github.com/alex-feel/hugo-artifacts/shortcodes/callout"

[params]

  [params.seo]
    description = 'A fixture site that imports the seo, agent-readiness, search, pwa, og-image and url-retirement modules together.'

    # The generated-image hook, wired across a real module boundary: seo calls
    # og-image for a page that has no image of its own, and publishes whatever
    # comes back as og:image. Both keys are needed together. image_partial
    # alone could not show that the hook OUTRANKS the site banner, because with
    # no default configured every "an og:image is present" assertion passes
    # either way; default_image alone could not show that a card ever displaces
    # it. The banner is a different file in a different color, so which of the
    # two answered is readable from the published bytes.
    image_partial = 'og-image/card.html'
    default_image = '/img/site-banner.png'

    [params.seo.organization]
      name = 'Composition Fixture'
      type = 'Organization'

  [params.agent]
    sections = ['/blog']

    [params.agent.llms]
      title = 'Composition Fixture'
      summary = 'A fixture site that imports the seo, agent-readiness and search modules together.'

      [[params.agent.llms.sections]]
        name = 'Blog'
        section = 'blog'
        limit = 0

    [params.agent.facts]
      title = 'About This Fixture'
      summary = 'Everything the fixture knows, in one fetch.'

      [[params.agent.facts.sections]]
        name = 'Blog'
        section = 'blog'

  # No [[params.agent.skills]] entries: every skill entry names a remote
  # source the module fetches at build time, and this suite stays offline. The
  # `agentskills` format therefore stays wired in the home list -- which is
  # what the merged-list assertion reads -- while publishing no document, the
  # documented behavior for an unconfigured skills surface.

  [params.search]
    sections = 'blog'
    # Dotted rather than a [table] header, which would swallow the flat key
    # above it into that table.
    opensearch.enable = true

  # The card generator behind the seo hook above. Routing covers the home page
  # and the blog section and NOTHING else, so /search/ reaches the hook, gets
  # no card, and falls through to the site banner -- the decline half of the
  # contract, end to end across two modules.
  [params.ogcard]

    [params.ogcard.kinds]
      home = 'card'

    [params.ogcard.sections]
      blog = 'card'

    [params.ogcard.templates.card]
      # A flat single-color raster: the corner pixel of a published card names
      # the base it was composed on, so a card can be traced back to THIS
      # site's asset rather than to anything the module carries. No font is
      # registered, so the text is drawn in Hugo's built-in face.
      background = 'og/card-base.png'

      [[params.ogcard.templates.card.text]]
        source = 'title'
        size = 40
        x = 60
        y = 280
        align = 'left'
        color = '#ffffff'
