[outputFormats]

  # Publishes /llms.txt (llmstxt.org convention). text/plain is deliberate:
  # its suffix is `txt`, so the file is llms.txt; text/markdown would publish
  # llms.md because its suffixes are md, mdown, markdown. text/plain is also
  # the Content-Type the convention specifies, so no header override is needed.
  # `root` is intentionally NOT set: leaving it false publishes one file per
  # language tree (/llms.txt, /ru/llms.txt), mirroring the search module's
  # searchindex format, instead of having every language overwrite one path.
  [outputFormats.llmstxt]
    mediaType = 'text/plain'
    baseName = 'llms'
    isPlainText = true
    notAlternative = true

  # Publishes /llms-index.txt, the COMPLETE link index that /llms.txt names
  # from its `## Start here` section. Same mediaType reasoning as llmstxt
  # above: text/plain's suffix is `txt`, so baseName 'llms-index' publishes
  # llms-index.txt with no header override.
  #
  # The NAME is chosen against `llms-full.txt`, whose qualifier slot names
  # CONTENT VOLUME -- platforms that publish it (and the llms-small/medium/full
  # family beside it) mean a document carrying the linked pages' bodies, which
  # this module still does not ship. `index` names the FORM instead: links,
  # complete. `root` is intentionally NOT set, so a multilingual site gets
  # /llms-index.txt and /ru/llms-index.txt rather than one path every language
  # overwrites -- exactly as llmstxt does, because the two documents come from
  # one page walk and must publish per language together.
  [outputFormats.llmsindex]
    mediaType = 'text/plain'
    baseName = 'llms-index'
    isPlainText = true
    notAlternative = true

  # Publishes /about.md, the one-fetch facts index. text/markdown's first
  # suffix is `md`, so baseName 'about' publishes about.md. `root` is
  # intentionally NOT set, so a multilingual site gets /about.md and
  # /ru/about.md rather than one overwritten path. notAlternative keeps it
  # out of .AlternativeOutputFormats: it is a site-level document, not a
  # representation of the home page.
  [outputFormats.agentfacts]
    mediaType = 'text/markdown'
    baseName = 'about'
    isPlainText = true
    notAlternative = true

  # Publishes /.well-known/agent-skills/index.json. A nested `path` is
  # accepted (verified on Hugo v0.160.1) even though the documentation
  # describes `path` as the first path segment. isPlainText is mandatory or
  # Go's html/template mangles the JSON. notAlternative keeps it out of
  # .AlternativeOutputFormats. root pins the path irrespective of the
  # carrier page.
  [outputFormats.agentskills]
    mediaType = 'application/json'
    path = '.well-known/agent-skills'
    baseName = 'index'
    isPlainText = true
    notAlternative = true
    root = true

[module]

  [module.hugoVersion]
    min = "0.160.0"
