# Consumer-facing defaults for the agent-readiness module.
#
# Every key can be overridden, from lowest to highest precedence:
#   1. this file (module defaults)
#   2. site config:       [params.agent]
#   3. page front matter: agent: (map)
#   4. call-site args:    {{ partial "agent-readiness/…" (dict "page" . "<key>" <value>) }}
# Presence wins at every tier, so an explicit false or empty value overrides
# the tier below it. Keys marked SITE-SCOPED shape site-wide artifacts
# (robots.txt, llms.txt, about.md, the skills index) and are honored at
# tiers 1 and 2 only.
#
# EVERY surface's own `enable` is SITE-SCOPED -- markdown, llms, llms_index,
# facts and skills_index alike -- because those keys govern whether an
# ARTIFACT EXISTS rather than what it contains, and a lower tier that switched
# one document off would leave every other surface still linking it with a URL
# that 404s. The per-page opt-out that keeps all of them in agreement is
# `agent: false`.

# --- Master switch (SITE-SCOPED) ---
# Site-scoped deliberately: every surface must select the same page set, and
# a page-tier `agent.enable = false` would drop that page's twin while
# leaving it listed in llms.txt and about.md. The per-page opt-out is
# `agent: false` / `agent: {exclude: true}`, which the shared page filter
# honors on every surface at once.
enable = true

# --- Shared page selection (SITE-SCOPED) ---
# Section allow-list; empty indexes every regular page.
sections = []
# Skip pages whose `robots` front matter contains "noindex".
exclude_noindex = true
# Skip the dedicated search page (its body is UI chrome, not content).
exclude_search_page = true
search_page_path = "/search"

# --- robots.txt (SITE-SCOPED) ---
[robots]
enable = true
# Directives for the catch-all User-agent: * group. Both ship EMPTY: a group
# with no directives is already fully permissive under RFC 9309, and a shipped
# `Allow: /` would tie against a consumer-configured `Disallow: /` at equal
# path length -- a tie RFC 9309 section 2.2.2 resolves in favor of Allow, so
# the configured block would silently never happen.
allow = []
disallow = []
# Content Signals declaration placed inside the User-agent: * group.
# Empty emits no line. Grammar: "search=yes, ai-train=yes, ai-input=yes".
# NOT an IETF standard -- see the README.
content_signal = ""
# Named tokens from data/agent-readiness/bots.toml, each emitted as its own group.
bots = []
# Directives applied to every group named in `bots`. Empty for the same
# reason as `allow` above: a shipped `Allow: /` would neutralize exactly the
# `bots_disallow = ["/"]` these groups exist to carry.
bots_allow = []
bots_disallow = []
# Verbatim lines appended after the last group, before Sitemap.
extra = []
sitemap = true

# --- Markdown twins ---
# Every key here is settable at all four tiers EXCEPT `enable`, which is
# SITE-SCOPED like every other surface switch (see the header note). The
# remaining keys govern twin CONTENT and are page-settable.
[markdown]
enable = true
# Emit the leading YAML front-matter block.
front_matter = true
# Emit `canonical:` pointing at the page's HTML URL.
canonical = true
# Emit `last_updated:` (ISO date from .Lastmod) when it differs from `date`.
last_updated = true
# Emit `build_time:` (RFC 3339 with offset) -- when this BUILD ran, which is a
# DIFFERENT question from `last_updated`, when the CONTENT changed. The value
# is identical in every document one build publishes and is the same string
# the public agent-readiness/build-time.html partial returns, so a consuming
# site can stamp its own surfaces with it. Consequence of leaving it on: every
# twin's bytes change on every build even when no content changed, which
# matters only to a consumer that diffs published output to decide whether to
# deploy -- that consumer sets this false.
build_time = true
# Emit `license:` (one URL line) immediately before the always-last canonical.
license = false
# Emit a member roster in a SECTION twin, between the body and the trailing
# pointer section: one `- [title](url): description` line per page the shared
# filter admits under the section's path. Complete by definition -- never a
# first-N window -- and never on the home twin, whose site-level enumeration
# is llms.txt's job. Default ON, because the roster is the point of a section
# twin: a front-matter-only _index.md would otherwise publish an empty body.
section_pages = true
# Append a trailing sitemap section linking the site map or llms.txt.
sitemap_section = true
sitemap_section_target = "llms"   # "llms" | "sitemap" | "none"

# --- Per-section front-matter field maps ---
# Consumer-declared and intentionally empty here: the vocabulary is
# site-specific. Shape: [frontmatter.<section>] keys = ["a", "b"].
# Do NOT list title, description, date, last_updated, build_time, license, or
# canonical: the builder emits all seven itself and skips (with a warning) any
# per-section key that repeats one.
[frontmatter]

# --- llms.txt ---
[llms]
enable = true   # SITE-SCOPED (see the header note on surface switches)
title = ""     # falls back to site.Title
summary = ""   # the required one-line blockquote
notes = ""     # optional free prose after the blockquote
# Link the Markdown twin when the page has one, else the HTML permalink.
link_markdown = true
# Emit one "> Content licensed under [name](url)." line after the summary.
license = false
# Emit one "> Build time: <RFC 3339>" line after the license line. Same value
# and same trade-off as [markdown] build_time above; the switch is per surface
# because `license` already is.
build_time = true
# Front-matter key that `select = 'flagged'` reads on each page, when an entry
# names none of its own. An author marks a page for the compact index at the
# page rather than in config by setting it truthy.
flag = "llms_featured"
# Ordered sections; each becomes an H2 in BOTH documents. Shape:
#   [[llms.sections]] name = "Blog"  section = "blog"  limit = 0
# Four optional keys per entry decide what the COMPACT /llms.txt keeps; the
# complete /llms-index.txt ignores all four and lists the section whole:
#   select = "first" | "flagged" | "all"    (default "first")
#   order  = "weight" | "date" | "title"    (default "weight" -- the site's
#            own page order: weight ascending with UNWEIGHTED pages LAST,
#            then date descending, then title)
#   limit  = <non-negative whole number>    (0 = complete; ignored by "all")
#   flag   = "<front-matter key>"           (falls back to `flag` above)
sections = []
# Links an agent may drop when shortening context. Shape:
#   [[llms.optional]] name = "…"  url = "/…"  note = "…"
optional = []

# --- /llms-index.txt (the complete link index) ---
# Every page of every section named in [[llms.sections]], never capped and
# never filtered by that entry's selection principle -- the route /llms.txt
# names so a narrower compact index costs REACH rather than ACCESS. It carries
# only this one key: the H1, summary, license, build-time, prose, `Optional`
# entries and section list all come from [llms] above, because two documents
# built from one page walk must not be able to drift apart.
#
# It renders through the same renderer as /llms.txt, so [llms] enable = false
# switches BOTH documents off; this key switches off the complete one alone.
[llms_index]
enable = true   # SITE-SCOPED (see the header note on surface switches)

# --- /about.md (aggregated facts document) ---
[facts]
enable = true   # SITE-SCOPED (see the header note on surface switches)
title = ""     # falls back to the agent_facts_title i18n string, then site.Title
summary = ""   # optional one-line blockquote under the H1
# Link each entry's Markdown twin alongside its HTML URL.
link_markdown = true
# Emit one "> Build time: <RFC 3339>" line under the H1 and summary. Same
# value and same trade-off as [markdown] build_time above.
build_time = true
# Ordered complete listings; each becomes an H2 and lists EVERY page the
# shared filter admits for that section -- never a first-N window. Shape:
#   [[facts.sections]] name = "Skills"  section = "skills"
sections = []
# Trailing pointer to llms.txt and the sitemap.
sitemap_section = true

  # Identity rows, read from a real content page so they cannot drift.
  [facts.identity]
  page = "/"
  # Shape: [[facts.identity.rows]] label = "Role"  key = "main_subtitle"
  rows = []

  # Contact channels, read from a real content page's front matter.
  [facts.contact]
  page = ""            # empty omits the contact section entirely
  key = "channels"     # front-matter key holding the array of channels
  label_field = "label"
  value_field = "value"
  url_field = "href"

# --- /.well-known/agent-skills/ ---
[skills_index]
enable = true   # SITE-SCOPED (see the header note on surface switches)
schema = "https://schemas.agentskills.io/discovery/0.2.0/schema.json"
# Emit the top-level "generated" key: the build's RFC 3339 timestamp. Same
# value and same trade-off as [markdown] build_time above. It answers what the
# per-skill `digest` cannot -- a digest says "is this different", never "which
# one is newer" -- and the discovery convention explicitly requires clients to
# ignore fields they do not recognize.
build_time = true
# What to do with a skill indexed as a single SKILL.md that turns out to ship
# supporting files -- proven, by resolving a reference out of its own body
# against its source URL and finding the file really there. "warn" publishes it
# and says so; "omit" refuses it. The default warns because the detection is
# best-effort by construction and an empty index publishes NO file at all, so a
# missed guess must not be able to delete the whole surface.
on_supporting_files = "warn"
# Consumer-declared array of tables; empty emits NO file at all. Shape:
#   [[params.agent.skills]] name = "…" description = "…" source = "<pinned URL>"
# `type` is optional and defaults to "skill-md"; set it to "archive" for a
# skill distributed as a .tar.gz or .zip whose ROOT is the skill directory.
# `description` may be omitted for a "skill-md" entry, in which case the value
# is taken verbatim from the fetched SKILL.md front matter; an "archive" entry
# must declare one, because the module cannot read inside an archive.

# --- Content license (SITE-SCOPED) ---
# Identity of the license covering the site's editorial content. Empty
# values emit nothing, so this table is inert until a consumer fills it.
[license]
name = ""     # human label, e.g. "CC BY 4.0"
url = ""      # absolute deed or legal-code URL
spdx = ""     # SPDX identifier, e.g. "CC-BY-4.0"; reserved for consumers
