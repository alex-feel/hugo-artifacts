# The `edge` environment collects the misconfigurations and deployment shapes
# that no other build can reach. They are grouped into one environment because
# they do not interact: each drives a different guard, and none of them changes
# what the others observe.
#
# What it reaches, and why nothing else can:
#
#   1. A SUBPATH baseURL. Every other fixture is at a domain root, which hides
#      the one input form Hugo's absURL treats specially: a value that already
#      starts with "/" resolves against the protocol and host only, DISCARDING
#      the baseURL's path. A consumer-authored "/sitemap.xml" therefore has to
#      be normalized before absolutizing, and only a non-root baseURL can tell
#      a correct implementation from a broken one.
#
#   2. A license with a `url` but no `name`. The `configured` environment sets
#      all three license keys together, so the guard that refuses to publish
#      a Markdown link with an empty label never runs there.
#
#   3. An unrecognized `sitemap_section_target`. No other environment sets the
#      key at all, so neither the enum's warn nor its non-default branches
#      have ever executed.
#
#   4. A `sections` allow-list that admits /dupes, whose two pages publish to
#      one URL. The collision guard sits after the allow-list in the filter,
#      so the pages must be IN scope to reach it -- and they are out of scope
#      everywhere else, which is what keeps every other build's counts intact.
#
#   5. A consumer-authored [[llms.optional]] entry restating the module's own
#      Agent Skills index URL. llms.html dedups its derived index entry by
#      absolutized URL against the consumer's entries, and only a build that
#      lists the index manually -- here at the URL the subpath deployment
#      actually publishes -- can prove the derived entry is suppressed rather
#      than doubled.
#
#   6. A second consumer-authored [[llms.optional]] entry, this one restating
#      the HOME PAGE'S OWN Markdown twin, which llms.html otherwise derives
#      into its leading `## Start here` heading. The same absolutized-URL
#      dedup covers both derived entries, and only a build that declares the
#      twin by hand can prove the derived one steps aside -- leaving the
#      consumer's wording, under their chosen heading, and no `## Start here`
#      at all. Every other build proves the opposite half, that the heading
#      appears with no consumer configuration whatsoever.
#
#   7. The two [params.agent.skills_index] scalars written wrong: a `$schema`
#      that is not an absolute URI, and an `on_supporting_files` outside the
#      key's two-value vocabulary. Every other build leaves both at their
#      shipped values or sets a valid one, so neither fallback has anywhere
#      else to execute.
baseURL = 'https://example.org/docs/'

[params]

  [params.agent]
    sections = ['/blog', 'projects/', '/dupes']

    # A `$schema` that is not an absolute URI. The convention makes this field
    # the one thing a client keys its whole decision on -- an index whose
    # `$schema` it does not recognize is one it "SHOULD NOT process" -- so a
    # relative or empty value publishes a document conforming clients discard
    # wholesale, silently, with every other gate green. The shipped default
    # stands in for it and the substitution is named.
    [params.agent.skills_index]
      schema = 'agent-skills/0.2.0'

      # A disposition outside the key's two-value vocabulary, and the third
      # thing a consumer writes after 'warn' and 'omit'. It falls back to the
      # SAFER value, 'warn', which is also the shipped default -- so the
      # fallback publishes exactly the bytes this build would publish with the
      # key absent, and only the warning distinguishes a working guard from a
      # deleted one. That is why the assertion reads both the warning and the
      # entry the disposition governs: a fallback silently switched to 'omit'
      # would delete `fixture-multi` from this index while the warning still
      # fired.
      on_supporting_files = 'delete'

    [params.agent.license]
      # Deliberately no `name`. The llms.txt line is composed as [name](url),
      # so emitting it would publish a link with an empty label.
      url = 'https://creativecommons.org/licenses/by/4.0/'

    [params.agent.robots]
      # The directive emission paths execute in no other build: the module
      # ships all four lists empty (correctly -- a Disallow shipped as a
      # default would deindex a site on the build after import, and a
      # shipped Allow would tie against a configured Disallow of equal path
      # length, a tie RFC 9309 resolves in favor of Allow). The catch-all
      # pair proves Allow and Disallow placement inside one group.
      # bots_disallow is set WITHOUT bots_allow on purpose: this is the
      # blocking shape the empty bots_allow default exists to keep working,
      # so the bot groups here must carry no Allow line at all.
      allow = ['/']
      # The last entry carries an embedded line break (a TOML basic string
      # with \n): the emitter must collapse it to one Disallow line rather
      # than let a path value inject a directive line of its own.
      disallow = ['/private/', '/tmp/', "/drafts/\n/old-drafts/"]
      bots_disallow = ['/']
      # A scalar where a list is expected. Go's range accepts no string, so
      # without coercion this alone would stop the build -- against the
      # module's published never-fail contract.
      extra = '# a single extra line written as a bare string'

    # A scalar where an array of field names belongs. This is the table every
    # consuming site hand-authors, and a one-field vocabulary is ordinary, so
    # `keys = 'title'` is at least as likely as the bots typo above -- and it
    # aborted the build until it was coerced.
    [params.agent.frontmatter]
      [params.agent.frontmatter.dupes]
        keys = 'title'

    [params.agent.markdown]
      sitemap_section_target = 'bogus'
      # Nested-map merge, not replace: setting ONE key here must leave every
      # other markdown key at its shipped value. That is a named acceptance
      # criterion no build could reach, because no fixture had ever set a
      # markdown content key at all.
      canonical = false

    # Restated in full, not extended: a higher-priority config REPLACES a
    # slice rather than merging into it. Without a section entry that admits
    # /dupes, the collision guard would still fire but nothing would list the
    # surviving page, so "listed exactly once" would assert against zero.
    [params.agent.llms]
      license = true

      [[params.agent.llms.sections]]
        name = 'Blog'
        section = 'blog'
        limit = 0

      [[params.agent.llms.sections]]
        name = 'Projects'
        section = '/projects/'
        limit = 0

      [[params.agent.llms.sections]]
        name = 'Dupes'
        section = '/dupes'
        limit = 0

      # A non-numeric limit. `int` raises a template error on it, which would
      # stop the build over a one-character config typo, so it is reported and
      # read as 0 -- complete -- instead.
      [[params.agent.llms.sections]]
        name = 'Bad Limit'
        section = 'blog'
        limit = 'all'

      # The four ways the selection keys can be got wrong. Each degrades to a
      # documented fallback and warns once; none may fail the build.
      #
      # An unrecognized `select` falls back to 'first' rather than omitting
      # the section: a typo in a brand-new key must not delete content. The
      # cap makes the fallback OBSERVABLE -- without it the entry would list
      # the section complete, which is what an omitted-and-restored entry and
      # a working one look like alike.
      [[params.agent.llms.sections]]
        name = 'Bad Select'
        section = 'blog'
        select = 'newest'
        limit = 1

      # An unrecognized `order` is the one that would be FATAL if it reached
      # `sort`: the function takes a field name, and a name no page carries
      # aborts template execution. It must be validated against the closed
      # vocabulary before any sort runs, and fall back to the site's own page
      # order.
      [[params.agent.llms.sections]]
        name = 'Bad Order'
        section = 'blog'
        order = 'popularity'
        limit = 2

      # A flag no page under the section carries. No project is flagged, so
      # this selects nothing -- and the heading is withheld with a message
      # naming the FLAG, distinct from the section-matches-nothing message,
      # because the remedies differ.
      [[params.agent.llms.sections]]
        name = 'Flagged Projects'
        section = 'projects'
        select = 'flagged'

      # A cap set beside `select = 'all'`. `select` wins and the section is
      # listed complete, because `select` names the principle while `limit`
      # parameterizes a different one.
      [[params.agent.llms.sections]]
        name = 'All Blog'
        section = 'blog'
        select = 'all'
        limit = 1

      [[params.agent.llms.optional]]
        name = 'Sitemap'
        url = '/sitemap.xml'
        note = 'Every published URL.'

      # The module's own Agent Skills index, restated by hand at the URL the
      # build actually publishes: skills inherit from _default (params merge
      # deep), the agentskills format is wired there, and the subpath baseURL
      # keeps /docs/ in the published path. The name and note deliberately
      # differ from the module's i18n strings so the output shows WHICH entry
      # won: llms.html must keep this one and suppress its derived twin.
      [[params.agent.llms.optional]]
        name = 'Skills'
        url = 'https://example.org/docs/.well-known/agent-skills/index.json'
        note = 'Consumer-authored entry for the Agent Skills index.'

      # The home page's own Markdown twin, restated by hand at the URL this
      # subpath deployment actually publishes. llms.html would otherwise
      # derive it into a leading `## Start here` heading; because this entry
      # claims the same URL, the derived one must step aside entirely -- no
      # `## Start here` in this build, and this wording kept instead. The
      # name and note deliberately differ from what the derivation would
      # produce so the output shows WHICH entry won.
      [[params.agent.llms.optional]]
        name = 'Front door'
        url = '/index.md'
        note = 'Consumer-authored entry for the home twin.'
