# The `configured` environment adds exactly the content-license keys, so the
# suite can compare a configured build against the baseline one and prove
# both halves of the contract: every license surface appears when the table
# is filled and both switches are on, and NOTHING appears when they are not.
#
# In a config/<environment>/params.toml the top level is already `params`, so
# these tables are [agent.*] rather than [params.agent.*].
[agent]

  [agent.license]
    name = 'CC BY 4.0'
    url = 'https://creativecommons.org/licenses/by/4.0/'
    spdx = 'CC-BY-4.0'

  [agent.markdown]
    license = true

  [agent.llms]
    license = true
