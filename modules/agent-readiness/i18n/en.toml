# English UI strings for the agent-readiness module. Templates never call
# T directly: agent-readiness/config.html resolves every key once into
# $cfg.i18n through the repository's English-default idiom
# ({{ T "key" | default "English" }}), so a site whose language ships no
# translation still renders a real heading rather than an empty string.
#
# The module authors exactly sixteen strings: seven headings in generated
# documents, four display labels for the module's site-level surfaces --
# returned by the agent-readiness/surfaces.html public partial, and, for the
# two link indexes, also naming them in a twin's trailing pointer section --
# the name and note of two derived llms.txt entries -- the complete link index in the `## Start here`
# section and the Agent Skills index in `## Optional` -- and the notice a
# narrowed section of the compact /llms.txt opens with.
# "## Optional" in llms.txt is deliberately NOT a key here: it is fixed by
# the llmstxt.org convention and is a protocol token, not prose.
# agent_sitemap_heading is deliberately NOT shipped either, for a different
# reason: it is the consumer-side override key for the trailing pointer
# heading, winning over both target-specific defaults. Hugo merges i18n
# files per key with a project's value beating a module's, and T returns
# "" for a key no source defines, so config.html looks that key up FIRST
# and falls through to the shipped target-derived default
# (agent_sitemap_heading_sitemap or agent_sitemap_heading_llms) only when
# no site defines it. Shipping it would satisfy every lookup from inside
# the module and make the two per-target defaults unreachable.
#
# This file carries flat keys only. Should a plural table ever be added, it
# MUST sit LAST: a TOML table header claims every key-value pair that follows
# it until the next header, so a mid-file table would silently swallow all the
# flat keys below it.

# Heading of the trailing pointer section when it points at sitemap.xml: a
# twin with sitemap_section_target = 'sitemap', and about.md's dual-pointer
# block, which always includes sitemap.xml.
agent_sitemap_heading_sitemap = "Sitemap"

# Heading of the trailing pointer section in a Markdown twin when it points
# at llms.txt, the default target. "Sitemap" would misname a curated link
# index, so the llms target carries its own default.
agent_sitemap_heading_llms = "Site index"

# H2 of the member roster in a section's Markdown twin.
agent_section_pages_heading = "Pages"

# H1 fallback for about.md when [params.agent.facts] title is unset.
agent_facts_title = "About"

# H2 of the identity block in about.md.
agent_facts_identity_heading = "Identity"

# H2 of the contact block in about.md.
agent_facts_contact_heading = "Contact"

# H2 of the llms.txt section holding the derived routes an agent must not drop
# -- the home page's own Markdown twin and, in the compact document, the
# complete link index. Unlike "## Optional", which the llmstxt.org convention
# fixes as a protocol token, this heading is ordinary prose and is translated.
agent_llms_start_heading = "Start here"

# Link text of the derived complete-index entry that llms.html appends to the
# `## Start here` section of the COMPACT /llms.txt. It names the document that
# lists every page of every section, so a narrower compact index costs reach
# rather than access.
agent_llms_index_entry_name = "Complete index"

# Note of that same entry, rendered after the `- [name](url): ` prefix. It
# describes the TARGET rather than claiming the compact file is truncated,
# which with no caps configured it is not.
agent_llms_index_entry_note = "Every page of every section, complete."

# The notice that opens a section of the compact /llms.txt whose selection
# dropped pages the shared filter admitted, so a reader cannot mistake a
# selection for the whole list and read an absence as a fact about the site.
# A section that dropped nothing does not carry it, and the complete index
# never does.
#
# THIS VALUE IS A FORMAT STRING and is the module's only one: it carries
# exactly two %d verbs, the number of pages KEPT and then the number
# ADMITTED, in that order. A translation may place them anywhere in the
# sentence, but must keep both, keep them in that order, and keep them
# spelled %d -- a dropped or renamed verb prints a Go formatting error into
# a published document instead of a number.
agent_llms_partial_note = "This section lists %d of %d pages; a page missing here may still exist on the site."

# Display label of the compact link index (/llms.txt), wherever the module
# names that document: the entry surfaces.html returns, and the first link of
# a Markdown twin's trailing pointer section. One document carries one name,
# so renaming it is this one key rather than one key per call site.
# "llms.txt" is the llmstxt.org protocol token and stays untranslated in
# every language.
agent_surface_llms = "llms.txt"

# Display label of the complete link index (/llms-index.txt), in the same two
# places and for the same reason.
agent_surface_llms_index = "Complete index"

# Display label for the facts document (/about.md) entry returned by
# surfaces.html.
agent_surface_facts = "Site facts"

# Display label for the Agent Skills index entry returned by surfaces.html.
# "Agent Skills" is the agentskills.io convention's proper name and stays
# untranslated in every language.
agent_surface_skills = "Agent Skills index"

# Link text of the derived Agent Skills index entry that llms.html appends
# to llms.txt's `## Optional` section when the index publishes. "Agent
# Skills" stays untranslated in every language, as above.
agent_skills_entry_name = "Agent Skills index"

# Note of that same llms.txt entry, rendered after the `- [name](url): `
# prefix.
agent_skills_entry_note = "Machine-readable index of this site's published agent skills"
