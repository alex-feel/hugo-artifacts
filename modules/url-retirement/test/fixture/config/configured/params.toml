[url_retirement]

  [url_retirement.redirects]
    rules = 'url-retirement/_redirects'
    status = 308
    trailing_slash = 'slash'

  [url_retirement.manifest]
    # Neither entry is reachable any other way -- Hugo exposes the sitemap's
    # publication to no template, and nothing in this build publishes the legacy
    # path -- so both are load-bearing and this build stays silent, which is
    # what its place among the strict-log environments requires. A URL claimed
    # by BOTH this list and a registration belongs to the `extra-redundant`
    # environment instead: the module reports that overlap, and a diagnostic
    # cannot land in a build held to silence.
    extra = ['/sitemap.xml', '/legacy/hand-copied.html']

    # One entry per way a URL can reach the manifest, because the subtraction
    # runs on the finished set and a version of it that ran earlier would still
    # remove the first of these: a page's secondary output format, a pager the
    # site registered during the html pass, a URL a template registered for a
    # file it published outside the page graph, and a path the `extra` list
    # above claims -- which also settles which key wins when both name one path.
    exclude = [
      '/posts/index.xml',
      '/posts/page/2/',
      '/probe/published-by-url-read.txt',
      '/legacy/hand-copied.html',
    ]
