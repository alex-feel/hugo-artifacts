# The faults that cannot share a key with the ones in `degraded`: a key holds
# one value, so an unknown status and a table-shaped status are two builds.
# Every value here is a shape or vocabulary mistake, and each must warn once and
# leave the shipped default standing.
[url_retirement]
  enable = 'yse'

  [url_retirement.redirects]
    enable = 'nope'

    [url_retirement.redirects.rules]
      not = 'a path'

    [url_retirement.redirects.pagination_path]
      not = 'a segment'

  [url_retirement.manifest]
    output_formats = 'maybe'
    extra = ['/kept.html', 'no-leading-slash.html', 'https://elsewhere.example/x']
    # The same two element faults on the subtracting key. A malformed entry
    # there fails quietly on its own -- it matches no URL and removes nothing --
    # so the diagnostic is the only thing that tells a site its exclusion never
    # took effect.
    exclude = ['no-leading-slash-either.html', 'https://elsewhere.example/y']
