# Two entries, one per arm of the rule, both named site-wide so both languages
# answer for both.
#
# The first is registered by the fixture's home page, which renders once per
# language, so every language that publishes a manifest reaches it without this
# list: redundant everywhere, and reported once for the build rather than once
# per language.
#
# The second is a German section's own URL. German reaches it through its page
# walk while English never publishes it at all, so for English this entry is the
# only thing carrying the path -- the shape the module must NOT report, and the
# reason the question is asked of the whole build instead of one language's
# file. A site listing a language-prefixed path in a site-wide `extra` is doing
# nothing wrong, and hearing that the entry is redundant would send it to delete
# the line that keeps the URL in the other language's manifest.
#
# The third entry is named site-wide like the others and EXCLUDED by German
# alone, which is the one shape in which a language can name an entry and never
# answer for it: German skips the entry because its own exclusion decides the
# outcome there, so it records no verdict. Counting it as a language that must
# answer would hold the tally one short forever and silence the entry on every
# build, for English too, where it really is redundant. So German is not counted
# as a namer, English answers alone, and the entry is reported. German's own
# exclusion lives in this environment's hugo.toml, where a [languages] table can
# be written at all.
[url_retirement]

  [url_retirement.manifest]
    extra = ['/probe/copied-verbatim.txt', '/de/posts/', '/probe/also-published-by-url-read.txt']
