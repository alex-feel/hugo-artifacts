# Baseline configuration: [params.ogcard] is deliberately ABSENT here, so the
# default build proves the module is inert when a site imports it and
# configures nothing. A TOML overlay can add a table but never delete one, so
# the unconfigured state has to be the _default environment and every working
# configuration lives in config/<environment>/.
baseURL = 'https://og-fixture.example/'
title = 'OG Image Fixture'
disableKinds = ['sitemap', 'rss', '404']

[taxonomies]
  tag = 'tags'

[outputs]
  home = ['html']
  section = ['html']
  page = ['html']
  taxonomy = ['html']
  term = ['html']

[module]

  [module.hugoVersion]
    min = "0.160.0"

  [[module.imports]]
    path = "github.com/alex-feel/hugo-artifacts/modules/og-image"
