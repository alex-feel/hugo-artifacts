# The working card set. This is the ONLY environment whose build log must be
# silent: every positive assertion in the suite is made against it, so a
# warning here means a configuration this suite claims is correct is not.
#
# Geometry is arithmetic, not taste. The title box is 1040 pixels wide at size
# 64 with safety 0.98, so the budget is floor(1040 * 1000 * 0.98 / 64) = 15925
# per mille, which is 26 glyphs of the 600-per-mille monospace table in
# data/og-image/metrics-local.toml, and every expected line count in
# tests/04-wrapping.spec.js is derived from that number.
#
# The two text slots carry DIFFERENT colors on purpose: one color cannot tell
# a slot that took its own configured value from a slot that took the other
# slot's, and Hugo draws an unreadable color as white without saying so.
#
# This environment's MODULE level names none of the nine typography keys, and
# that absence is load-bearing: it is what makes the `unstyled` template at
# the bottom a statement about the SHIPPED defaults rather than about a value
# some level of this file supplied. The `typography` environment states the
# opposite half, where the module level names a face, a width table and a
# line height that no slot repeats.

[ogcard]
  width = 1200
  height = 630
  format = 'png'
  anchor = 'Center'

  # No default_template: a page no route names gets no card, which is what
  # tests/06-decline.spec.js measures. Every deg-* section is unrouted here
  # and routed in the degraded environment, so the same content set is silent
  # in this build and faulty in that one.
  [ogcard.sections]
    blog = 'post'
    twins = 'plain'
    oversize = 'oversize'
    sources = 'sources'
    facts = 'datafacts'
    aligned = 'aligned'
    overlays = 'overlaid'
    fitting = 'fitting'
    unstyled = 'unstyled'
    bgsource = 'bgresource'
    bgparam = 'bgparam'
    bgdata = 'bgdata'

  [ogcard.kinds]
    home = 'home'

  [ogcard.fonts]
    mono = 'fonts/Go-Mono.ttf'
    sans = 'fonts/SourceSans3-Regular.otf'

  # ---- home: a distinct flat background, so a card's corner pixel names the
  #      template that composed it. The two probe slots below the title are
  #      what makes the home page's own emptiness measurable: `section` and
  #      `section_title` name nothing on the home page and both draw on every
  #      other page, and this ONE template is used by both, so the difference
  #      is the page rather than the configuration. blog/variant.md asks for
  #      the same template from a blog page, and its second card carries the
  #      two lines this card must not.
  [ogcard.templates.home]
    background = 'og/home-bg.png'

    [[ogcard.templates.home.text]]
      source = 'title'
      font = 'mono'
      metrics = 'mono'
      size = 64
      color = '#ffd400'
      x = 72
      y = 120
      width = 1040
      max_lines = 3

    [[ogcard.templates.home.text]]
      source = 'section'
      font = 'mono'
      size = 28
      color = '#ffd400'
      x = 72
      y = 440

    [[ogcard.templates.home.text]]
      source = 'section_title'
      font = 'mono'
      size = 28
      color = '#ffd400'
      x = 72
      y = 500

  # ---- post: the full shape -- two slots, two colors, two sizes, and one
  #      overlay pinned to a corner.
  [ogcard.templates.post]
    background = 'og/post-bg.png'

    [[ogcard.templates.post.text]]
      source = 'title'
      font = 'mono'
      metrics = 'mono'
      size = 64
      color = '#ffd400'
      x = 72
      y = 120
      width = 1040
      max_lines = 3
      line_height = 1.4
      align = 'left'
      overflow = 'shrink'
      min_scale = 0.7
      shrink_step = 4
      safety = 0.98

    [[ogcard.templates.post.text]]
      source = 'description'
      font = 'mono'
      metrics = 'mono'
      size = 32
      color = '#33ccff'
      x = 72
      y = 430
      width = 960
      max_lines = 2

    # 80 pixels square, anchored bottom right and moved 48 pixels inward on
    # both axes: (1200 - 80) - 48 = 1072 and (630 - 80) - 48 = 502, so the
    # badge occupies exactly x 1072..1151, y 502..581 and nothing outside it.
    [[ogcard.templates.post.overlay]]
      source = 'asset'
      src = 'og/badge.png'
      width = 80
      anchor = 'bottomright'
      x = 48
      y = 48

  # ---- plain: the post background with a title and NO overlay, so a card
  #      carrying zero badge pixels is distinguishable from one that lost its
  #      overlay by accident.
  [ogcard.templates.plain]
    background = 'og/post-bg.png'

    [[ogcard.templates.plain.text]]
      source = 'title'
      font = 'mono'
      metrics = 'mono'
      size = 64
      color = '#ffd400'
      x = 72
      y = 120
      width = 1040
      max_lines = 3

  # ---- wrongsize: an 800x400 background normalized up to the canvas.
  [ogcard.templates.wrongsize]
    background = 'og/wrong-size.png'

    [[ogcard.templates.wrongsize.text]]
      source = 'title'
      font = 'mono'
      metrics = 'mono'
      size = 64
      color = '#ffd400'
      x = 72
      y = 120
      width = 1040
      max_lines = 3

  # ---- otf: an OpenType face, measured against the shipped nominal table.
  #      Hugo's own documentation lists OpenType as unsupported for
  #      images.Text while the module's guard admits it, and this build is
  #      warning-gated, so the card either draws or the suite goes red.
  [ogcard.templates.otf]
    background = 'og/post-bg.png'

    [[ogcard.templates.otf.text]]
      source = 'title'
      font = 'sans'
      metrics = 'default'
      size = 64
      color = '#ffd400'
      x = 72
      y = 120
      width = 1040
      max_lines = 3

  # ---- oversize: an overlay wider and taller than the canvas, anchored at
  #      the top left, so it covers the whole card and the base color is gone.
  [ogcard.templates.oversize]
    background = 'og/post-bg.png'

    [[ogcard.templates.oversize.text]]
      source = 'title'
      font = 'mono'
      metrics = 'mono'
      size = 64
      color = '#ffd400'
      x = 72
      y = 120
      width = 1040
      max_lines = 3

    [[ogcard.templates.oversize.overlay]]
      source = 'asset'
      src = 'og/badge.png'
      width = 1400
      anchor = 'topleft'
      x = 0
      y = 0

  # ---- sources: one row per text source, one source per row, drawn in a
  #      monospace face at a constant advance so the ROW COUNT and the glyph
  #      count of each row say which source resolved and what it resolved to.
  #      Row 8 reads a page parameter no page carries, so it draws nothing at
  #      all -- prefix and suffix included, which is what makes twelve rows
  #      rather than thirteen the assertion that they glue only to a value
  #      that exists. The last four rows draw the same nine characters under
  #      the four case transforms: none and lower land on the x-height, upper
  #      and title reach the cap height, and the ink of each is a different
  #      amount, so no two of them can be confused.
  [ogcard.templates.sources]
    background = 'og/post-bg.png'

    [[ogcard.templates.sources.text]]
      source = 'section'
      font = 'mono'
      size = 28
      color = '#ffd400'
      x = 72
      y = 16

    [[ogcard.templates.sources.text]]
      source = 'section_title'
      font = 'mono'
      size = 28
      color = '#ffd400'
      x = 72
      y = 60

    [[ogcard.templates.sources.text]]
      source = 'kind'
      font = 'mono'
      size = 28
      color = '#ffd400'
      x = 72
      y = 104

    [[ogcard.templates.sources.text]]
      source = 'site_title'
      font = 'mono'
      size = 28
      color = '#ffd400'
      x = 72
      y = 148

    [[ogcard.templates.sources.text]]
      source = 'domain'
      font = 'mono'
      size = 28
      color = '#ffd400'
      x = 72
      y = 192

    # An explicit layout rather than the default, so the row is the same ten
    # glyphs in every language this fixture builds.
    [[ogcard.templates.sources.text]]
      source = 'date'
      key = '2006-01-02'
      font = 'mono'
      size = 28
      color = '#ffd400'
      x = 72
      y = 236

    [[ogcard.templates.sources.text]]
      source = 'literal'
      value = 'mid'
      prefix = '<<'
      suffix = '>>'
      font = 'mono'
      size = 28
      color = '#ffd400'
      x = 72
      y = 280

    [[ogcard.templates.sources.text]]
      source = 'literal'
      value = 'mid'
      font = 'mono'
      size = 28
      color = '#ffd400'
      x = 72
      y = 324

    # No page carries this parameter, so this row draws nothing -- and its
    # prefix and suffix draw nothing either.
    [[ogcard.templates.sources.text]]
      source = 'param'
      key = 'nosuchparam'
      prefix = '['
      suffix = ']'
      font = 'mono'
      size = 28
      color = '#ffd400'
      x = 72
      y = 368

    [[ogcard.templates.sources.text]]
      source = 'literal'
      value = 'anon crux'
      font = 'mono'
      size = 28
      color = '#ffd400'
      x = 72
      y = 412

    [[ogcard.templates.sources.text]]
      source = 'literal'
      value = 'anon crux'
      case = 'upper'
      font = 'mono'
      size = 28
      color = '#ffd400'
      x = 72
      y = 456

    [[ogcard.templates.sources.text]]
      source = 'literal'
      value = 'ANON CRUX'
      case = 'lower'
      font = 'mono'
      size = 28
      color = '#ffd400'
      x = 72
      y = 500

    [[ogcard.templates.sources.text]]
      source = 'literal'
      value = 'anon crux'
      case = 'title'
      font = 'mono'
      size = 28
      color = '#ffd400'
      x = 72
      y = 544

  # ---- datafacts: the rows source='data' can resolve, on the sources
  #      template's monospace terms: the row count says which lookups drew
  #      and the glyph count of each row says what. The two list rows draw
  #      TWO lines each at the shipped pitch of round(28 * 1.4) = 39, so the
  #      row after each of them starts 88 pixels down rather than 44. The two
  #      absent rows -- a key data/ does not carry, and a dotted path that
  #      runs through a scalar -- carry a prefix and a suffix, so their
  #      drawing nothing is also the statement that the glue dropped with the
  #      value. tests/14-sources.spec.js reads every row.
  [ogcard.templates.datafacts]
    background = 'og/post-bg.png'

    # A string out of data/facts/values.toml, three segments deep.
    [[ogcard.templates.datafacts.text]]
      source = 'data'
      key = 'facts.values.identity.name'
      font = 'mono'
      size = 28
      color = '#ffd400'
      x = 72
      y = 16

    # A number out of the same table, drawn as its digits.
    [[ogcard.templates.datafacts.text]]
      source = 'data'
      key = 'facts.values.identity.since'
      font = 'mono'
      size = 28
      color = '#ffd400'
      x = 72
      y = 60

    # A flat list: two items, two lines, no pre-joining in the data file.
    [[ogcard.templates.datafacts.text]]
      source = 'data'
      key = 'facts.values.identity.roles'
      font = 'mono'
      size = 28
      color = '#ffd400'
      x = 72
      y = 104

    # A flat list out of the page's own front matter: the same one-item-per-
    # line rule through source='param'.
    [[ogcard.templates.datafacts.text]]
      source = 'param'
      key = 'highlights'
      font = 'mono'
      size = 28
      color = '#ffd400'
      x = 72
      y = 192

    # A key no data file carries: nothing draws, the glue included.
    [[ogcard.templates.datafacts.text]]
      source = 'data'
      key = 'facts.values.identity.nickname'
      prefix = '['
      suffix = ']'
      font = 'mono'
      size = 28
      color = '#ffd400'
      x = 72
      y = 280

    # A dotted path that runs THROUGH a scalar: absent, not an error.
    [[ogcard.templates.datafacts.text]]
      source = 'data'
      key = 'facts.values.identity.name.deeper'
      prefix = '['
      suffix = ']'
      font = 'mono'
      size = 28
      color = '#ffd400'
      x = 72
      y = 324

  # ---- aligned: the same ten glyphs in the same 1000-pixel box, drawn once
  #      per alignment. A wrapped slot draws one filter per line and computes
  #      the alignment anchor itself -- x for left, x plus half the width for
  #      center, x plus the width for right -- so the three rows' ink
  #      positions are the only place that arithmetic is visible. The rows sit
  #      below the title box so the whole-tree wrapping assertion still
  #      measures only titles.
  [ogcard.templates.aligned]
    background = 'og/post-bg.png'

    [[ogcard.templates.aligned.text]]
      source = 'literal'
      value = 'MMMMMMMMMM'
      font = 'mono'
      metrics = 'mono'
      size = 64
      color = '#ffd400'
      x = 72
      y = 420
      width = 1000
      max_lines = 1
      align = 'left'

    [[ogcard.templates.aligned.text]]
      source = 'literal'
      value = 'MMMMMMMMMM'
      font = 'mono'
      metrics = 'mono'
      size = 64
      color = '#ffd400'
      x = 72
      y = 490
      width = 1000
      max_lines = 1
      align = 'center'

    [[ogcard.templates.aligned.text]]
      source = 'literal'
      value = 'MMMMMMMMMM'
      font = 'mono'
      metrics = 'mono'
      size = 64
      color = '#ffd400'
      x = 72
      y = 560
      width = 1000
      max_lines = 1
      align = 'right'

  # ---- overlaid: the three overlay sources the badge cannot reach. param
  #      takes a path from the page's own front matter and resolves it against
  #      the page's bundle first and assets/ second; resource matches a glob
  #      against the page's bundle; data takes a path from a data file, so it
  #      does not depend on the page at all. Each lands in its own 80-pixel
  #      square, and the four squares carry four different flat colors, so
  #      which source resolved is a bounding box rather than a guess. The
  #      third square is the badge at half opacity: a blend of two known
  #      colors is neither of them, which is what tells a faded overlay from
  #      an opaque one.
  #
  #      Six pages share this template: two carrying an assets/ path in the
  #      parameter (one spelled site-absolutely, which the module trims), one
  #      leaf bundle whose parameter and glob both name its own image, two
  #      whose parameter holds a path no lookup can resolve (one the
  #      operating system refuses and one that is not a matchable pattern),
  #      and the section page, which carries neither. All of those are the
  #      page's value rather than the template's, so all of them are silent,
  #      and this build's silence is gated.
  [ogcard.templates.overlaid]
    background = 'og/post-bg.png'

    [[ogcard.templates.overlaid.text]]
      source = 'title'
      font = 'mono'
      metrics = 'mono'
      size = 64
      color = '#ffd400'
      x = 72
      y = 120
      width = 1040
      max_lines = 2

    [[ogcard.templates.overlaid.overlay]]
      source = 'param'
      key = 'cardbadge'
      width = 80
      anchor = 'topleft'
      x = 200
      y = 440

    [[ogcard.templates.overlaid.overlay]]
      source = 'resource'
      match = '*avatar*'
      width = 80
      anchor = 'topleft'
      x = 400
      y = 440

    [[ogcard.templates.overlaid.overlay]]
      source = 'asset'
      src = 'og/badge.png'
      opacity = 0.5
      width = 80
      anchor = 'topleft'
      x = 600
      y = 440

    # The fourth square reads its path out of data/. The key is the
    # template's and the value is the data file's, so unlike the param and
    # resource squares this one appears on EVERY page of the template, the
    # section page included -- data has no page in it.
    [[ogcard.templates.overlaid.overlay]]
      source = 'data'
      key = 'facts.values.identity.badge'
      width = 80
      anchor = 'topleft'
      x = 800
      y = 440

  # ---- fitting: overflow = 'truncate', which skips the shrink ladder
  #      entirely and truncates at the base size. Row 0 draws the same title
  #      that walks the ladder to its floor under shrink, so the pitch of its
  #      lines is what separates the two policies. Rows 1 and 2 draw one
  #      unbreakable token under two different ellipsis strings, so the ink on
  #      the truncated line says which ellipsis was actually appended.
  [ogcard.templates.fitting]
    background = 'og/post-bg.png'

    [[ogcard.templates.fitting.text]]
      source = 'title'
      font = 'mono'
      metrics = 'mono'
      size = 64
      color = '#ffd400'
      x = 72
      y = 40
      width = 1040
      max_lines = 2
      line_height = 1.4
      overflow = 'truncate'
      min_scale = 0.7
      shrink_step = 4

    [[ogcard.templates.fitting.text]]
      source = 'literal'
      value = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
      font = 'mono'
      metrics = 'mono'
      size = 64
      color = '#ffd400'
      x = 72
      y = 300
      width = 1040
      max_lines = 1
      overflow = 'truncate'
      ellipsis = ''

    [[ogcard.templates.fitting.text]]
      source = 'literal'
      value = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
      font = 'mono'
      metrics = 'mono'
      size = 64
      color = '#ffd400'
      x = 72
      y = 460
      width = 1040
      max_lines = 1
      overflow = 'truncate'
      ellipsis = 'MMMM'

  # ---- unstyled: the other end of the typography cascade, and the only
  #      template in this suite whose slots name NONE of the nine keys at any
  #      level -- not the slot, not the template, and not this environment's
  #      module level. What they draw with is therefore what the module ships
  #      and nothing else: Hugo's built-in face, because the module carries no
  #      font and never invents one, and the 1.4 line height that is the one
  #      number data/og-image/defaults.toml states.
  #
  #      Rows 0 to 2 are the same eight glyphs at the same size, drawn by a
  #      slot naming the monospace face, by a slot naming no face at all, and
  #      by a slot naming the empty face. The last two must ink identically
  #      and both must differ from the first, which is what says an unset font
  #      means Hugo's own rather than some fallback of the module's.
  #
  #      Row 3 wraps. Its 240-pixel box takes one word a line under the
  #      shipped nominal table (M is 940 per mille there), so it draws three
  #      lines whose pitch is round(size * line_height) -- the shipped 1.4 on
  #      the section page, and 2.0 on unstyled/a.md, which overrides the
  #      module level from front matter and is the only place in this suite
  #      where a typography key travels Hugo's own four tiers.
  [ogcard.templates.unstyled]
    background = 'og/post-bg.png'

    [[ogcard.templates.unstyled.text]]
      source = 'literal'
      value = 'MMMMMMMM'
      font = 'mono'
      size = 48
      x = 72
      y = 40

    [[ogcard.templates.unstyled.text]]
      source = 'literal'
      value = 'MMMMMMMM'
      size = 48
      x = 72
      y = 140

    [[ogcard.templates.unstyled.text]]
      source = 'literal'
      value = 'MMMMMMMM'
      font = ''
      size = 48
      x = 72
      y = 240

    [[ogcard.templates.unstyled.text]]
      source = 'literal'
      value = 'MMMM MMMM MMMM'
      size = 40
      x = 72
      y = 420
      width = 240
      max_lines = 0

  # ---- bgresource / bgparam: a card composed ON the page's own artwork.
  #      Both tiles are deliberately at aspect ratios nothing could reach by
  #      being composited as a full-bleed overlay -- 400x40 and 40x400 against
  #      a 1200x630 canvas -- so a card whose FOUR CORNERS carry the tile's
  #      color can only have been normalized with .Fill. Each tile carries its
  #      own flat color, and each fallback a different one again, so a corner
  #      pixel names which of the three answered rather than merely that
  #      something did.
  #
  #      Three pages share bgresource: the leaf bundle carrying tile.png, the
  #      plain page carrying nothing (its card is the fallback), and the
  #      section page, which carries nothing either. bgparam has a section of
  #      its own rather than being reached from front matter, because front
  #      matter travels with the content into every environment and would card
  #      that page in builds whose silence is gated.
  [ogcard.templates.bgresource]
    background = { source = 'resource', match = 'tile.png', fallback = 'og/post-bg.png' }

    [[ogcard.templates.bgresource.text]]
      source = 'title'
      font = 'mono'
      metrics = 'mono'
      size = 64
      color = '#ffd400'
      x = 72
      y = 120
      width = 1040
      max_lines = 2

  # The same key written as a sub-table rather than inline: a site may write
  # either, and TOML is the only thing that can tell them apart.
  [ogcard.templates.bgparam]

    [ogcard.templates.bgparam.background]
      source = 'param'
      key = 'bgcover'
      fallback = 'og/home-bg.png'

    [[ogcard.templates.bgparam.text]]
      source = 'title'
      font = 'mono'
      metrics = 'mono'
      size = 64
      color = '#ffd400'
      x = 72
      y = 120
      width = 1040
      max_lines = 2

  # ---- bgdata: the backdrop's path read out of data/. The value is stored
  #      site-absolutely ('/og/home-bg.png') on purpose: the module trims one
  #      leading slash before the lookups, so the spelling a data file tends
  #      to carry still resolves. No fallback is declared, so a card filled
  #      with the home color is the proof the primary source answered --
  #      declining is what failure looks like here.
  [ogcard.templates.bgdata]
    background = { source = 'data', key = 'facts.values.identity.backdrop' }

    [[ogcard.templates.bgdata.text]]
      source = 'title'
      font = 'mono'
      metrics = 'mono'
      size = 64
      color = '#ffd400'
      x = 72
      y = 120
      width = 1040
      max_lines = 2
