# A width table for the monospace face this fixture draws with, supplied the
# way a consuming site supplies one: data/og-image/metrics-local.toml, which
# the module never ships, merged per NAME over the shipped tables.
#
# Go Mono advances every glyph by 1229/2048 of the em, so a single width of
# 600 per mille describes the whole face to within a thousandth of an em.
# That is what makes a line count arithmetic rather than a guess: at size 64
# in a 1040-pixel box the budget is floor(1040 * 1000 * 0.98 / 64) = 15925
# per mille, which is 26 glyphs, and every wrapping assertion in this suite
# is derived from that number rather than read off a rendered card.
#
# The shipped [fonts.default] table stays untouched, so the merge-per-name
# path is exercised without shadowing anything the module ships.
#
# The `wide` table models nothing real. It exists so that two slots drawn in
# the SAME face and the same box can still break their lines in different
# places: at twice the monospace width, a box that takes two words under
# `mono` takes one under `wide`, and a band count is then the width table a
# slot resolved rather than an opinion about the picture.
#
# The four tables after the monospace one are of the wrong shape, one per
# level of this file a consumer can get wrong. Nothing reads them except the
# degraded environment's diagnostic card, because a width table is resolved
# only when a slot names it by name -- which is what keeps a malformed table
# out of every other build in this suite.

[fonts]
# A name whose value is not a table at all.
scalartable = 'not a table at all'

[fonts.mono]
em = 1000
space = 600
fallback = 600

[fonts.wide]
em = 1000
space = 600
fallback = 1200

# classes is an array of tables; a bare string is not one.
[fonts.badclasses]
em = 1000
classes = 'abc'

# glyphs maps one character to its width; a bare string is not a map.
[fonts.badglyphs]
em = 1000
glyphs = 'ABC'

# A classes entry needs both a chars string and a width.
[[fonts.badclassentry.classes]]
width = 900
