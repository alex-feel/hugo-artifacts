name: CI

on:
  # Pull requests only. A merge into main produces a commit whose TREE is
  # identical to the head that was just tested, so a push trigger re-runs
  # every suite over bytes that already passed minutes earlier -- the same
  # waste as testing on a timer, for the same reason: the code did not change
  # between the two runs. Keep pull requests required to be up to date with
  # main, and the merged result is the tree the pull request run covered.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Hugo + Go + lints)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history: the module-pin check resolves each intra-repository
          # require against the sibling directory's latest commit.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: false

      - name: Set up Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Verify Hugo and Go versions
        run: |
          hugo version
          go version
          node --version
          npm --version

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify leaf go.mod files parse
        shell: bash
        run: |
          set -euo pipefail
          # Every leaf go.mod file MUST parse via `go mod edit -fmt -print`.
          # This is a read-only operation that does NOT require network access.
          # Each leaf go.mod is verified independently from its own directory.
          # Keep this list in sync with the leaf */go.mod set.
          leaves=(
            modules/pwa
            modules/workbox
            modules/idb
            modules/seo
            modules/social-share
            modules/search
            modules/images
            modules/carousel
            modules/agent-readiness
            modules/copy-page
            modules/og-image
            modules/url-retirement
            shortcodes/github-repo
            shortcodes/github-profile
            shortcodes/hf-space
            shortcodes/callout
            shortcodes/youtube-embed
            shortcodes/arxiv-paper
            modules/pwa/test/fixture
            modules/social-share/test/fixture
            modules/search/test/fixture
            modules/images/test/fixture
            modules/carousel/test/fixture
            modules/carousel/test/fixture-bare
            modules/carousel/test/fixture-invalid
            modules/seo/test/fixture
            modules/agent-readiness/test/fixture
            modules/agent-readiness/test/fixture-shadow
            modules/agent-readiness/test/fixture-paginated
            modules/agent-readiness/test/fixture-widgets
            modules/agent-readiness/test/fixture-extra
            modules/copy-page/test/fixture
            modules/og-image/test/fixture
            modules/url-retirement/test/fixture
            shortcodes/github-profile/test/fixture
            shortcodes/test-smoke/fixture
            modules/test-composition/fixture
          )
          for leaf in "${leaves[@]}"; do
            echo "::group::go mod edit -fmt -print -- ${leaf}/go.mod"
            ( cd "${leaf}" && go mod edit -fmt -print )
            echo "::endgroup::"
          done

      - name: Module pins are real and current
        shell: bash
        run: npm run check:pins

      - name: Hugo mod graph (standalone modules)
        shell: bash
        run: |
          set -euo pipefail
          # EVERY leaf module graphs standalone, with no [module.replacements]
          # and no consumer-side compensation: intra-repository requires name
          # real commit pseudo-versions and the non-Go-aware upstreams
          # (github.com/GoogleChrome/workbox, github.com/jakearchibald/idb)
          # fetch over the module proxy as +incompatible versions. This step is
          # what proves a consumer can import any one of these modules alone,
          # so keep the list in sync with the leaf module set.
          for m in modules/pwa modules/workbox modules/idb modules/seo modules/social-share modules/search modules/images modules/carousel modules/agent-readiness modules/copy-page modules/og-image modules/url-retirement shortcodes/github-repo shortcodes/github-profile shortcodes/hf-space shortcodes/callout shortcodes/youtube-embed shortcodes/arxiv-paper; do
            echo "::group::hugo mod graph -- ${m}"
            ( cd "${m}" && hugo mod graph )
            echo "::endgroup::"
          done

      - name: ESLint (eslint v9 flat config)
        run: npm run lint

      - name: Prettier (format:check)
        run: npm run format:check

      - name: Markdown lint (markdownlint-cli2)
        # The pinned devDependency that `npm ci` just installed, not the
        # action's own bundled copy: two independently versioned engines over
        # the same files disagree the moment either side moves, and the
        # disagreement surfaces as a lint that passes locally and fails here.
        # This also uses the repo's .markdownlint-cli2.jsonc glob set rather
        # than a glob restated in this file.
        run: npm run lint:md

      - name: YAML lint (yamllint)
        uses: ibiqlik/action-yamllint@v3
        with:
          # `.` rather than `.github`: the repo root carries tracked YAML of
          # its own -- including .yamllint.yml, the config governing this very
          # step -- which a .github-only scope never checks. The action's own
          # ignore rules keep node_modules out.
          file_or_dir: .
          config_file: .yamllint.yml
          strict: true

      - name: EditorConfig conformance
        shell: bash
        run: |
          set -euo pipefail
          # The checker is compiled from the Go module proxy (no dependency on
          # the GitHub releases API at run time) and executed directly, so
          # this step both installs AND runs the conformance check. It reads
          # .ecrc at the repo root, which disables the indent-size dimension:
          # indentation is governed by Prettier and the template docstring
          # style, while this check enforces the line endings, charset, final
          # newline, and trailing whitespace rules from .editorconfig.
          #
          # .ecrc also excludes the license text that ships beside a vendored
          # font in a test fixture. That text is reproduced verbatim from
          # upstream and its exact bytes are the point of committing it, so a
          # tab or a trailing space in it is content rather than a formatting
          # slip, and reformatting it to satisfy this check would misstate the
          # license the font is distributed under.
          go install github.com/editorconfig-checker/editorconfig-checker/v3/cmd/editorconfig-checker@v3.0.3
          "$(go env GOPATH)/bin/editorconfig-checker"

  # EVERY suite, one job per suite so a failure
  # names the module that broke rather than a single opaque red X, and so the
  # slowest suite does not set the wall clock for all of them. Before this
  # existed CI ran lints only: it never rendered a template, so no template
  # error of any kind could turn it red, and three suites were silently broken
  # on a maintainer machine for an unknown length of time without anything
  # surfacing it.
  #
  # Nothing is held out for being network-dependent. A module changes exactly
  # once, in a pull request, so that is the only moment its templates can break
  # and the only moment worth testing them; a suite moved off the blocking set
  # re-tests unchanged code on a timer and leaves the one change that matters
  # unguarded.
  suites:
    name: Suite (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Every suite reports, always. Stopping at the first failure would hide
      # whether one module broke or all of them did, which is the single most
      # useful thing to know when a shared convention changes.
      fail-fast: false
      matrix:
        # `deps` marks a suite that has a package-lock.json to install from.
        # modules/test-composition deliberately has none: its package.json
        # states it carries no dependencies because node --test and
        # node:assert are enough, so it gets Node but no install step. Adding
        # a lockfile there to make this matrix uniform would be inventing a
        # file to satisfy the workflow instead of describing what is true.
        include:
          - name: images
            dir: modules/images/test
            run: bash run-tests.sh
            deps: true
          # The SECOND images row exists because that suite is the only one
          # whose subject is version-gated: modules/images emits AVIF from
          # Hugo 0.163.0 and warns-and-degrades below it, and
          # tests/07-avif-gate.spec.js asserts BOTH sides by branching on the
          # building Hugo's version. With one pinned version only one branch
          # can ever execute, so the three assertions describing what the
          # module actually publishes with AVIF enabled -- the avif chain is
          # emitted, it precedes the webp chain, derivatives land on disk --
          # were dead code in CI while the pin sat below the gate. Both sides
          # of a version gate have to run somewhere, so this row runs the
          # same suite below it while the row above runs at the pinned
          # current Hugo.
          - name: images (below the AVIF gate)
            dir: modules/images/test
            run: bash run-tests.sh
            deps: true
            hugo: '0.161.1'
          # Serves its own skills-index fixtures from a loopback origin it starts itself and calls
          # the GitHub, Hugging Face, arXiv and YouTube APIs in its widgets
          # build. It blocks anyway, because a module changes exactly once --
          # in a pull request -- so that is the only moment its templates can
          # break and the only moment worth testing them. It is also the only
          # build in this repository that renders shortcodes/arxiv-paper,
          # callout, github-repo, hf-space and youtube-embed at all.
          - name: agent-readiness
            dir: modules/agent-readiness/test
            run: bash run-tests.sh
            deps: true
          - name: seo
            dir: modules/seo/test
            run: bash run-tests.sh
            deps: true
          - name: carousel
            dir: modules/carousel/test
            run: bash run-tests.sh
            deps: true
            browser: true
          - name: copy-page
            dir: modules/copy-page/test
            run: bash run-tests.sh
            deps: true
            browser: true
          - name: search
            dir: modules/search/test
            run: bash run-tests.sh
            deps: true
            browser: true
          - name: social-share
            dir: modules/social-share/test
            run: bash run-tests.sh
            deps: true
            browser: true
          - name: github-profile
            dir: shortcodes/github-profile/test
            run: bash run-tests.sh
            deps: true
          - name: shortcode-smoke
            dir: shortcodes/test-smoke
            run: bash run-tests.sh
          - name: composition
            dir: modules/test-composition
            run: bash run-tests.sh
          - name: og-image
            dir: modules/og-image/test
            run: bash run-tests.sh
          # The SECOND og-image row runs the same suite at the module's
          # declared hugoVersion floor. Its cards are built out of primitives
          # introduced across several releases below that floor, and three of
          # the behaviors it relies on are undocumented upstream, so the only
          # way to know they hold at the version the module promises is to
          # build there. A floor nothing runs at is a promise to consumers that
          # nothing checks.
          - name: og-image (at the declared Hugo floor)
            dir: modules/og-image/test
            run: bash run-tests.sh
            hugo: '0.160.0'
          - name: url-retirement
            dir: modules/url-retirement/test
            run: bash run-tests.sh
          # The SECOND url-retirement row runs the same suite at the module's
          # declared hugoVersion floor. Both documents it publishes rest on
          # Hugo behaviors the documentation does not describe -- that output
          # formats render one at a time across the whole site and that a
          # non-zero weight orders those passes, that a root-published format on
          # a multilingual site is written by the last language to render, and
          # how a suffix-less format's template is named -- so the only way to
          # know they hold at the version the module promises is to build there.
          # A floor nothing runs at is a promise to consumers that nothing
          # checks.
          - name: url-retirement (at the declared Hugo floor)
            dir: modules/url-retirement/test
            run: bash run-tests.sh
            hugo: '0.160.0'
          - name: pwa
            dir: modules/pwa/test
            run: |
              npm run --silent test:subpath
              npm run --silent test:offline-gating
              bash run-matrix.sh
            deps: true
            browser: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: false

      - name: Set up Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          # A row may pin its own Hugo; everything else gets the current
          # one. Three suites use the override: modules/images, to run its
          # version-gated suite on both sides of the gate, and modules/og-image
          # and modules/url-retirement, to run their suites at the version their
          # hugo.toml promises consumers as well as at the current one.
          hugo-version: ${{ matrix.hugo || '0.164.0' }}
          extended: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          # Repo-wide rather than per-suite: one suite has no lockfile at all,
          # and a path that resolves in eight jobs and not the ninth fails
          # that job in setup, before a single assertion has run.
          cache-dependency-path: '**/package-lock.json'

      - name: Install suite dependencies
        if: matrix.deps
        working-directory: ${{ matrix.dir }}
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        if: matrix.browser
        working-directory: ${{ matrix.dir }}
        # --with-deps pulls the shared libraries the bundled browser needs on a
        # bare runner image; without them Playwright fails at launch rather
        # than at install, which reads as a test failure instead of a setup one.
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        working-directory: ${{ matrix.dir }}
        env:
          # Raises the GitHub API rate limit for the suites that fetch at build
          # time. Absent it those builds still succeed and degrade with WARN
          # lines, which their runners' log gates tolerate deliberately.
          HUGO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.run }}
