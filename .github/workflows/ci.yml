name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # The network suite runs on a schedule rather than on every push: it fetches
  # the GitHub, Hugging Face, arXiv and YouTube APIs at build time, so an
  # outage or a rate limit on somebody else's service would otherwise block an
  # unrelated merge. Nightly still catches a break within a day.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Hugo + Go + lints)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history: the module-pin check resolves each intra-repository
          # require against the sibling directory's latest commit.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: false

      - name: Set up Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.1'
          extended: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Verify Hugo and Go versions
        run: |
          hugo version
          go version
          node --version
          npm --version

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify leaf go.mod files parse
        shell: bash
        run: |
          set -euo pipefail
          # Every leaf go.mod file MUST parse via `go mod edit -fmt -print`.
          # This is a read-only operation that does NOT require network access.
          # Each leaf go.mod is verified independently from its own directory.
          # Keep this list in sync with the leaf */go.mod set.
          leaves=(
            modules/pwa
            modules/workbox
            modules/idb
            modules/seo
            modules/social-share
            modules/search
            modules/images
            modules/carousel
            modules/agent-readiness
            modules/copy-page
            shortcodes/github-repo
            shortcodes/github-profile
            shortcodes/hf-space
            shortcodes/callout
            shortcodes/youtube-embed
            shortcodes/arxiv-paper
            modules/pwa/test/fixture
            modules/social-share/test/fixture
            modules/search/test/fixture
            modules/images/test/fixture
            modules/carousel/test/fixture
            modules/carousel/test/fixture-bare
            modules/carousel/test/fixture-invalid
            modules/seo/test/fixture
            modules/agent-readiness/test/fixture
            modules/agent-readiness/test/fixture-shadow
            modules/agent-readiness/test/fixture-paginated
            modules/agent-readiness/test/fixture-widgets
            modules/agent-readiness/test/fixture-extra
            modules/copy-page/test/fixture
            shortcodes/github-profile/test/fixture
            modules/test-composition/fixture
          )
          for leaf in "${leaves[@]}"; do
            echo "::group::go mod edit -fmt -print -- ${leaf}/go.mod"
            ( cd "${leaf}" && go mod edit -fmt -print )
            echo "::endgroup::"
          done

      - name: Module pins are real and current
        shell: bash
        run: npm run check:pins

      - name: Hugo mod graph (standalone modules)
        shell: bash
        run: |
          set -euo pipefail
          # EVERY leaf module graphs standalone, with no [module.replacements]
          # and no consumer-side compensation: intra-repository requires name
          # real commit pseudo-versions and the non-Go-aware upstreams
          # (github.com/GoogleChrome/workbox, github.com/jakearchibald/idb)
          # fetch over the module proxy as +incompatible versions. This step is
          # what proves a consumer can import any one of these modules alone,
          # so keep the list in sync with the leaf module set.
          for m in modules/pwa modules/workbox modules/idb modules/seo modules/social-share modules/search modules/images modules/carousel modules/agent-readiness modules/copy-page shortcodes/github-repo shortcodes/github-profile shortcodes/hf-space shortcodes/callout shortcodes/youtube-embed shortcodes/arxiv-paper; do
            echo "::group::hugo mod graph -- ${m}"
            ( cd "${m}" && hugo mod graph )
            echo "::endgroup::"
          done

      - name: ESLint (eslint v9 flat config)
        run: npm run lint

      - name: Prettier (format:check)
        run: npm run format:check

      - name: Markdown lint (markdownlint-cli2)
        # The pinned devDependency that `npm ci` just installed, not the
        # action's own bundled copy: two independently versioned engines over
        # the same files disagree the moment either side moves, and the
        # disagreement surfaces as a lint that passes locally and fails here.
        # This also uses the repo's .markdownlint-cli2.jsonc glob set rather
        # than a glob restated in this file.
        run: npm run lint:md

      - name: YAML lint (yamllint)
        uses: ibiqlik/action-yamllint@v3
        with:
          # `.` rather than `.github`: the repo root carries tracked YAML of
          # its own -- including .yamllint.yml, the config governing this very
          # step -- which a .github-only scope never checks. The action's own
          # ignore rules keep node_modules out.
          file_or_dir: .
          config_file: .yamllint.yml
          strict: true

      - name: EditorConfig conformance
        shell: bash
        run: |
          set -euo pipefail
          # The checker is compiled from the Go module proxy (no dependency on
          # the GitHub releases API at run time) and executed directly, so
          # this step both installs AND runs the conformance check. It reads
          # .ecrc at the repo root, which disables the indent-size dimension:
          # indentation is governed by Prettier and the template docstring
          # style, while this check enforces the line endings, charset, final
          # newline, and trailing whitespace rules from .editorconfig.
          go install github.com/editorconfig-checker/editorconfig-checker/v3/cmd/editorconfig-checker@v3.0.3
          "$(go env GOPATH)/bin/editorconfig-checker"

  # Every suite that is deterministic offline, one job per suite so a failure
  # names the module that broke rather than a single opaque red X, and so the
  # slowest suite does not set the wall clock for all of them. Before this
  # existed CI ran lints only: it never rendered a template, so no template
  # error of any kind could turn it red, and three suites were silently broken
  # on a maintainer machine for an unknown length of time without anything
  # surfacing it.
  suites:
    name: Suite (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Every suite reports, always. Stopping at the first failure would hide
      # whether one module broke or all of them did, which is the single most
      # useful thing to know when a shared convention changes.
      fail-fast: false
      matrix:
        # `deps` marks a suite that has a package-lock.json to install from.
        # modules/test-composition deliberately has none: its package.json
        # states it carries no dependencies because node --test and
        # node:assert are enough, so it gets Node but no install step. Adding
        # a lockfile there to make this matrix uniform would be inventing a
        # file to satisfy the workflow instead of describing what is true.
        include:
          - name: images
            dir: modules/images/test
            run: bash run-tests.sh
            deps: true
          - name: seo
            dir: modules/seo/test
            run: bash run-tests.sh
            deps: true
          - name: carousel
            dir: modules/carousel/test
            run: bash run-tests.sh
            deps: true
            browser: true
          - name: copy-page
            dir: modules/copy-page/test
            run: bash run-tests.sh
            deps: true
            browser: true
          - name: search
            dir: modules/search/test
            run: bash run-tests.sh
            deps: true
            browser: true
          - name: social-share
            dir: modules/social-share/test
            run: bash run-tests.sh
            deps: true
            browser: true
          - name: github-profile
            dir: shortcodes/github-profile/test
            run: bash run-tests.sh
            deps: true
          - name: composition
            dir: modules/test-composition
            run: bash run-tests.sh
          - name: pwa
            dir: modules/pwa/test
            run: |
              npm run --silent test:subpath
              npm run --silent test:offline-gating
              bash run-matrix.sh
            deps: true
            browser: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: false

      - name: Set up Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.1'
          extended: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          # Repo-wide rather than per-suite: one suite has no lockfile at all,
          # and a path that resolves in eight jobs and not the ninth fails
          # that job in setup, before a single assertion has run.
          cache-dependency-path: '**/package-lock.json'

      - name: Install suite dependencies
        if: matrix.deps
        working-directory: ${{ matrix.dir }}
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        if: matrix.browser
        working-directory: ${{ matrix.dir }}
        # --with-deps pulls the shared libraries the bundled browser needs on a
        # bare runner image; without them Playwright fails at launch rather
        # than at install, which reads as a test failure instead of a setup one.
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.run }}

  # Held out of the blocking set on purpose. This suite proves the remote-fetch
  # digest guarantee, which cannot be proven without a real fetch, and its
  # widgets build calls the GitHub, Hugging Face, arXiv and YouTube APIs. Those
  # degrade to WARN lines when tokenless or rate-limited, by design -- but an
  # outage on somebody else's service must not block an unrelated pull request,
  # so it runs nightly and on demand instead.
  suites-network:
    name: Suite (agent-readiness, network)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: false

      - name: Set up Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.1'
          extended: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: modules/agent-readiness/test/package-lock.json

      - name: Install suite dependencies
        working-directory: modules/agent-readiness/test
        run: npm ci --no-audit --no-fund

      - name: Run the suite
        working-directory: modules/agent-readiness/test
        # The token raises the GitHub API rate limit for the widgets build.
        # Absent it the build still succeeds and degrades with WARN lines,
        # which the runner's log gates tolerate deliberately.
        env:
          HUGO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash run-tests.sh
